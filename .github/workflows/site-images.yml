# Fills the site's image slots. Manual, and the only trigger there is.
#
# There was a nightly Vercel cron in vercel.json as well; it is gone, and so is
# vercel.json, because that file held nothing else. Unattended runs spend real
# money at fal, and the endpoint starts its own follow-up invocations, so a run
# nobody asked for could not be stopped from outside.
#
# Two switches have to be on for this to do anything: run this workflow, and
# SITE_IMAGES_ENABLED="on" in the Vercel environment. Unset it afterwards.
#
# Set ADMIN_IMAGE_TOKEN as a repository secret and as a Vercel environment
# variable, both to the same value. Without it this falls back to the default
# already present in the code, which is public — so setting it is worth doing.
name: Generate site images

# Manual only. It used to fire on every push to main, which meant any deploy
# could start a few-hundred-image run without anyone asking for one. The
# endpoint is also gated on SITE_IMAGES_ENABLED, so this button does nothing
# until that is switched on in the Vercel environment.
on:
  workflow_dispatch:

concurrency:
  group: site-images
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for this commit to be live in production
        id: wait
        run: |
          # Matching the SHA is the point. An earlier version of this step just
          # checked that the route answered, which it already did from the
          # previous build — so the job ran against the code it was replacing.
          for i in $(seq 1 40); do
            sha=$(curl -s -m 20 "https://www.sjpt.io/api/version" \
              | python3 -c "import json,sys; print(json.load(sys.stdin).get('sha',''))" 2>/dev/null || echo "")
            echo "attempt $i: live sha=${sha:-none} (want ${GITHUB_SHA})"
            if [ "$sha" = "$GITHUB_SHA" ]; then echo "live=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            sleep 30
          done
          echo "live=false" >> "$GITHUB_OUTPUT"
          echo "::warning::This commit never became live; the nightly cron will pick the work up."

      - name: Generate the missing images
        if: steps.wait.outputs.live == 'true'
        env:
          TOKEN: ${{ secrets.ADMIN_IMAGE_TOKEN }}
        run: |
          # The endpoint chains its own follow-up invocations server-side, so
          # one call walks the whole set. A long timeout is expected: the first
          # batch generates images before it responds.
          code=$(curl -sS -m 900 -o response.json -w '%{http_code}' \
            "https://www.sjpt.io/api/cron/site-images?token=${TOKEN}" || echo 000)
          echo "HTTP $code"
          cat response.json || true
          echo
          case "$code" in
            200) echo "::notice::Generation started; it continues in the background." ;;
            412) echo "::warning::FAL_KEY is not set on the deployment, so nothing was generated." ;;
            401) echo "::error::Token rejected. Set ADMIN_IMAGE_TOKEN to the same value in GitHub and Vercel." ; exit 1 ;;
            *)   echo "::warning::Unexpected status $code; the nightly cron will retry." ;;
          esac
